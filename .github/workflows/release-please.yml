name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Lives here, not in a release-triggered workflow: releases created with
  # GITHUB_TOKEN don't trigger other workflows.
  upload-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: NO_LAUNCH=1 ./scripts/run.sh release
      - run: ditto -c -k --keepParent ".build/CodeAgent Meter.app" CodeAgent-Meter.zip
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" CodeAgent-Meter.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
