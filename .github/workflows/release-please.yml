name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # An app token (not GITHUB_TOKEN) so the release PR runs CI without
      # approval, as in teknikqa/upkeep.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Lives here to use the release outputs directly.
  upload-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A fixed self-signed identity keeps the app's code requirement the same
      # across releases, so Keychain "Always Allow" survives upgrades.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - run: NO_LAUNCH=1 ./scripts/run.sh release
        env:
          CODESIGN_IDENTITY: CodeAgent Meter Signing
      - run: ditto -c -k --keepParent ".build/CodeAgent Meter.app" CodeAgent-Meter.zip
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" CodeAgent-Meter.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/update-cask.sh "${TAG#v}"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
