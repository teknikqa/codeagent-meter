name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch new vulnerabilities without code changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Swift has to be built on macOS under CodeQL and takes about 15 minutes, so
  # it skips pull requests. Pushes to main and the weekly run still scan it.
  analyze-swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Only the app and the core it depends on; the test targets add build
      # time and aren't worth scanning.
      - run: swift build --product CodeAgentMeterApp

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
